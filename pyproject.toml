[project]
name = "whats-in-the-glass"
version = "0.1.0"
description = "LAN-local spirits guide"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.116,<1",
    "python-multipart>=0.0.20,<1",
    "uvicorn>=0.35,<1",
]

[dependency-groups]
dev = [
    "httpx>=0.28,<1",
    "httpx2>=2,<3",
    "pytest>=8.4,<9",
    "pyyaml>=6.0,<7",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
filterwarnings = ["error"]
