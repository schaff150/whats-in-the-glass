<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" role="img" aria-labelledby="title desc">
  <title id="title">What's in the Glass app icon</title>
  <desc id="desc">A brass outlined whisky tumbler with amber liquid and a question mark on a dark leather background.</desc>
  <defs>
    <linearGradient id="leather" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#6a4330"/>
      <stop offset="0.48" stop-color="#4b2e22"/>
      <stop offset="1" stop-color="#2d1c17"/>
    </linearGradient>
    <linearGradient id="amber" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#e0a44a"/>
      <stop offset="1" stop-color="#9a561f"/>
    </linearGradient>
    <pattern id="grain" width="44" height="44" patternUnits="userSpaceOnUse">
      <path d="M-8 11C8 2 21 21 42 8M5 37c15-11 24 5 48-9" fill="none" stroke="#f7e2c0" stroke-opacity=".045" stroke-width="3" stroke-linecap="round"/>
      <path d="M3 19c10-5 19 7 31 1" fill="none" stroke="#170d09" stroke-opacity=".08" stroke-width="2"/>
    </pattern>
    <filter id="shadow" x="-30%" y="-30%" width="160%" height="180%">
      <feDropShadow dx="0" dy="14" stdDeviation="15" flood-color="#160c08" flood-opacity=".6"/>
    </filter>
  </defs>
  <rect width="512" height="512" rx="108" fill="url(#leather)"/>
  <rect width="512" height="512" rx="108" fill="url(#grain)"/>
  <rect x="25" y="25" width="462" height="462" rx="88" fill="none" stroke="#d5aa65" stroke-opacity=".46" stroke-width="6"/>
  <g filter="url(#shadow)">
    <path d="M142 116h228l-28 286c-2 23-39 37-86 37s-84-14-86-37z" fill="#f8ead0" fill-opacity=".10" stroke="#f1d5a3" stroke-width="13" stroke-linejoin="round"/>
    <path d="M157 257h198l-15 139c-2 15-38 27-84 27s-82-12-84-27z" fill="url(#amber)"/>
    <path d="M157 257c30 13 65-9 99 0s68-11 99 0" fill="none" stroke="#f3c373" stroke-width="8" stroke-linecap="round"/>
    <path d="M142 116h228" stroke="#ffe3b1" stroke-width="16" stroke-linecap="round"/>
    <path d="M182 145l-8 82" stroke="#fff7e8" stroke-opacity=".45" stroke-width="12" stroke-linecap="round"/>
    <text x="256" y="368" text-anchor="middle" font-family="Georgia,serif" font-size="146" font-weight="700" fill="#fff4df">?</text>
  </g>
