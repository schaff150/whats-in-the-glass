services:
  whats-in-the-glass:
    environment:
      WITG_SECRET_KEY_FILE: /run/secrets/witg_master_key
      WITG_ADMIN_PASSWORD_FILE: /run/secrets/witg_admin_password
    secrets:
      - witg_master_key
      - witg_admin_password

secrets:
  witg_master_key:
    file: "${WITG_SECRET_KEY_PATH:?Set WITG_SECRET_KEY_PATH to an external master-key file}"
  witg_admin_password:
    file: "${WITG_ADMIN_PASSWORD_PATH:?Set WITG_ADMIN_PASSWORD_PATH to an external scrypt record}"
