services:
  whats-in-the-glass:
    build:
      context: .
    ports:
      - "8787:8787"
    environment:
      WITG_DATA_DIR: /data
      WITG_VOICEBOX_HOST_ALLOWLIST: ${WITG_VOICEBOX_HOST_ALLOWLIST:-}
      WITG_VOICEBOX_SPEECH_TIMEOUT_SECONDS: ${WITG_VOICEBOX_SPEECH_TIMEOUT_SECONDS:-600}
      FORWARDED_ALLOW_IPS: ${WITG_TRUSTED_PROXY_IPS:-172.17.0.1}
      WITG_TRUSTED_PROXY_IPS: ${WITG_TRUSTED_PROXY_IPS:-172.17.0.1}
    volumes:
      - witg-data:/data
    restart: unless-stopped
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - >-
          import urllib.request;
          urllib.request.urlopen('http://127.0.0.1:8787/api/health', timeout=3).read()
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 5s

volumes:
  witg-data:
